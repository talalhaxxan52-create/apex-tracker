<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Tracker</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0c">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22APEX%20Tracker%22,%22short_name%22:%22APEX%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0a0c%22,%22theme_color%22:%22%230a0a0c%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/857/857158.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <style>
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background: #121216;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #1f1f2e;
        }
        .logo-header {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .logo-header span {
            color: #f3a922;
        }
        .sub-header {
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c6c7d;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0ab;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1c1c24;
            border: 1px solid #2d2d3d;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: border 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #f3a922;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #f3a922;
            color: #0a0a0c;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background: #d4921c;
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }
        li {
            background: #1c1c24;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #f3a922;
        }
        .ex-name { font-weight: 600; }
        .ex-details { color: #a0a0ab; font-size: 14px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-header">AP<span>EX</span></div>
        <div class="sub-header">Workout Tracker</div>

        <div class="input-group">
            <label>Exercise</label>
            <input type="text" id="exercise" placeholder="e.g., Bench Press">
        </div>

        <div class="row">
            <div class="input-group" style="flex: 1;">
                <label>Sets</label>
                <input type="number" id="sets" placeholder="0">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Reps</label>
                <input type="number" id="reps" placeholder="0">
            </div>
        </div>

        <button onclick="addLog()">Log Workout</button>

        <ul id="logList"></ul>
    </div>

    <script>
        function addLog() {
            const ex = document.getElementById('exercise').value;
            const sets = document.getElementById('sets').value;
            const reps = document.getElementById('reps').value;
            
            if(!ex || !sets || !reps) return;
            
            const li = document.createElement('li');
            li.innerHTML = `<span class="ex-name">${ex}</span><span class="ex-details">${sets} sets × ${reps} reps</span>`;
            
            document.getElementById('logList').appendChild(li);
            
            // Clear inputs
            document.getElementById('exercise').value = '';
            document.getElementById('sets').value = '';
            document.getElementById('reps').value = '';
        }
    </script>
</body>
</html>
