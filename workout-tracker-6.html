<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Workout%20Tracker%22,%22short_name%22:%22Workout%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%230f172a%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/857/857158.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
        }
        .card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            box-sizing: border-box;
        }
        input {
            background-color: #334155;
            color: white;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #334155;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️‍♂️ Workout Tracker</h1>
        <div class="card">
            <input type="text" id="exercise" placeholder="Exercise Name (e.g., Pushups)">
            <input type="number" id="sets" placeholder="Sets">
            <input type="number" id="reps" placeholder="Reps">
            <button onclick="addWorkout()">Log Workout</button>
        </div>
        <ul id="workoutList"></ul>
    </div>

    <script>
        function addWorkout() {
            const ex = document.getElementById('exercise').value;
            const sets = document.getElementById('sets').value;
            const reps = document.getElementById('reps').value;
            if(!ex || !sets || !reps) return alert('Please fill all fields');
            
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${ex}</strong></span> <span>${sets} sets × ${reps} reps</span>`;
            document.getElementById('workoutList').appendChild(li);
            
            document.getElementById('exercise').value = '';
            document.getElementById('sets').value = '';
            document.getElementById('reps').value = '';
        }
    </script>
</body>
</html>
